services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - app-network
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-init
    profiles: ["init"]
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_USERNAME: sa
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
    - type: bind
      source: ./sqlserver/init.sql
      target: /scripts/init.sql
      read_only: true
    networks:
      - app-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        if [[ ! "$$DB_USERNAME" =~ ^[A-Za-z0-9_]+$$ ]]; then
          echo "DB_USERNAME may contain only letters, digits and underscores."
          exit 2
        fi
        DB_PASSWORD_SQL="$${DB_PASSWORD//\'/\'\'}"
        export SQLCMDPASSWORD="$$SA_PASSWORD"
        echo "Waiting for SQL Server authentication..."
        until /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U "$$SA_USERNAME" -C -b -Q "SELECT 1" >/dev/null 2>&1
        do
          sleep 5
        done
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U "$$SA_USERNAME" -C -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'$$DB_USERNAME') BEGIN EXEC(N'CREATE LOGIN [$$DB_USERNAME] WITH PASSWORD = N''$${DB_PASSWORD_SQL}'''); END"
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U "$$SA_USERNAME" -C -b -v DB_USERNAME="$$DB_USERNAME" -i /scripts/init.sql
        echo "Database and user initialization completed."

volumes:
  sqlserver-data:

networks:
  app-network:
    name: app-network
